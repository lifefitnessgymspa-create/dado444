<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Love 4 Ever 💜</title>
<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Cursive', Tahoma, sans-serif;
    direction: rtl;
    overflow: hidden;
}

/* صفحات */
.page {
    width: 100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    text-align: center;
    position: absolute;
    top: 0;
    left: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease;
    color: #fff;
    padding: 20px;
    box-sizing: border-box;
}
.page.active {
    opacity: 1;
    pointer-events: auto;
}

/* زخارف */
.decor {
    position: absolute;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.08), transparent 70%);
    z-index: 0;
}

/* القلوب الطافية */
.heart { color:#ff4d6d; font-size:28px; position:absolute; animation: float 6s infinite; z-index:5; }
@keyframes float { 0%{transform:translateY(0px) rotate(0deg);opacity:1;}50%{transform:translateY(-200px) rotate(180deg);opacity:0.7;}100%{transform:translateY(0px) rotate(360deg);opacity:1;} }

/* الأزرار */
button { position:relative; z-index:15; cursor:pointer; transition:0.3s; }
button:hover { opacity:0.85; }

/* الصفحة الأولى */
#page1 { background: linear-gradient(45deg, #6a0dad, #8a2be2); }
#page1 h1 { font-size: 32px; margin-bottom: 20px; z-index:5; position:relative; }
#page1 span { font-size:28px; color:#ff4d6d; z-index:5; position:relative; }
#page1 .love { font-size:16px; color:#ffb6c1; margin-top:10px; font-weight:bold; position:relative; z-index:5; }
#page1 button { background:#ff4d6d; border:none; padding:12px 25px; font-size:18px; border-radius:12px; }

/* الصفحة الثانية */
#page2 { background: linear-gradient(45deg, #8a2be2, #9b30ff); }
#page2 button { background:#ff4d6d; border:none; padding:12px 25px; font-size:18px; border-radius:12px; margin-top:10px; }
#page2 .time { position:absolute; bottom:20px; left:50%; transform:translateX(-50%); font-size:36px; z-index:10; }

/* الصفحة الثالثة */
#page3 { background: linear-gradient(45deg, #9b30ff, #ba55d3); }
#page3 .poem { font-size:20px; margin-top:15px; font-style:italic; opacity:0; transition: opacity 1s ease; position:relative; z-index:5; }
#kissesBtn { position:absolute; bottom:20px; right:20px; padding:8px 15px; font-size:14px; background:#ff4d6d; border:none; border-radius:10px; z-index:15; }
#memoriesBtn { position:absolute; bottom:20px; left:20px; padding:8px 15px; font-size:14px; background:#ffb6c1; border:none; border-radius:10px; z-index:15; display:none; }
#bigText { position:absolute; top:40%; left:50%; transform:translate(-50%, -50%); font-size:26px; font-weight:bold; color:#ffb6c1; text-align:center; opacity:0; transition: opacity 2s; z-index:10; }
#kissesContainer { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:50; }
#loveLabel { position:absolute; bottom:60px; right:20px; font-size:18px; color:#ffb6c1; font-weight:bold; z-index:15; }

/* الصفحة الرابعة */
#page4 { background: linear-gradient(45deg, #9b30ff, #ba55d3); overflow: hidden; }
.tulip { position:absolute; font-size:24px; animation: tulipFall 10s linear infinite; z-index:5; }
@keyframes tulipFall {
    0% {transform: translateY(-50px) rotate(0deg);}
    100% {transform: translateY(100vh) rotate(360deg);}
}
.memoryWord { 
    position:absolute; 
    padding:8px 12px; 
    background: rgba(255,77,109,0.8); 
    color:white; 
    border-radius:20px; 
    font-weight:bold; 
    opacity:0;
    transition: all 8s linear;
    z-index:10;
}
</style>
</head>
<body>

<!-- موسيقى -->
<audio id="bgMusic" autoplay loop>
  <source src="music.mp3" type="audio/mpeg">
  متصفحك لا يدعم تشغيل الموسيقى.
</audio>

<!-- الصفحة الأولى -->
<div class="page active" id="page1">
    <div class="decor"></div>
    <h1>من هالوقت 4:44 قررت كون شخص بتقدري تثقي فيه</h1>
    <span>❤️ dado ❤️</span>
    <div class="love">love for ever</div>
    <button onclick="nextPage(2)">ابدأ</button>

    <div class="heart" style="left:10%;">❤️</div>
    <div class="heart" style="left:40%; animation-delay:1s;">❤️</div>
    <div class="heart" style="left:70%; animation-delay:2s;">❤️</div>
</div>

<!-- الصفحة الثانية -->
<div class="page" id="page2">
    <div class="decor"></div>
    <div style="margin-bottom:10px; font-size:18px; line-height:1.3;">
إذَا رَأَيْتُ أَباها سَوْفَ أَشْكُرُهُ<br>
لِأنهُ اخْتَارَ أُمّاً كالأميراتِ<br>
فأَنتجا مِنْ جَمِيْلِ النَّسْلِ وَاحِدةً<br>
قَد جَمَّعَتْ كُلَّ أوصَافِ الجَمِيلات
</div>
    <button onclick="nextPage(3)">اضغطي الزر</button>
    <button onclick="nextPage(3)">اليوم شو؟</button>
    <div class="time">4:44</div>

    <div class="heart" style="left:15%;">❤️</div>
    <div class="heart" style="left:45%; animation-delay:1.5s;">❤️</div>
    <div class="heart" style="left:75%; animation-delay:0.5s;">❤️</div>
</div>

<!-- الصفحة الثالثة -->
<div class="page" id="page3">
    <div class="decor"></div>
    <div class="poem" id="poem"></div>

    <div class="heart" style="left:15%;">❤️</div>
    <div class="heart" style="left:45%; animation-delay:2s;">❤️</div>
    <div class="heart" style="left:75%; animation-delay:1s;">❤️</div>

    <div id="loveLabel">حبي اكبسي الزر</div>

    <button id="kissesBtn">تبليطات</button>
    <button id="memoriesBtn">ذكريات</button>

    <div id="kissesContainer"></div>
    <div id="bigText"></div>
</div>

<!-- الصفحة الرابعة -->
<div class="page" id="page4">
    <div class="decor"></div>
    <div id="tulipContainer"></div>
    <div id="memoryContainer"></div>
</div>

<script>
// بيوت الشعر اليومية
const poems = [
    "وإن طال بيني وبينكِ البعدُ — فالقلبُ ما خانَ",
    "ليس القربُ مسافة — القربُ أمان",
    "أحبكِ لا لأقيدكِ — بل لأطمئنكِ",
    "الوعدُ الصامتُ — أثقل من ألف كلام",
    "أنا معكِ — حتى وأنا بعيد",
    "القلبُ إذا تعلّم — لا يجرح",
    "الحبُ طمأنينة — لا خوف",
    "ما عدتُ أبحث عن عذر — بل عن صدق",
    "المسافةُ اختبار — وأنا اخترتُ الوفاء",
    "الثقةُ فعلٌ يومي — وأنا بدأت"
];

// تغيير الصفحة
function nextPage(num){
    for(let i=1;i<=4;i++){ document.getElementById("page"+i).classList.remove('active'); }
    document.getElementById("page"+num).classList.add('active');
    if(num===3) showPoem();
    if(num===4) showTulips();
}

// عرض بيت الشعر اليومي
function showPoem(){
    const today = new Date();
    const index = today.getDate() % poems.length;
    const poemDiv = document.getElementById("poem");
    poemDiv.innerText = poems[index];
    poemDiv.style.opacity = 1;
}

// تحديث بيت الشعر الساعة 4:44 صباحاً
setInterval(()=>{
    const now=new Date();
    if(now.getHours()===4 && now.getMinutes()===44){ showPoem(); }
},60000);

// زر التبليطات مع قبلات
document.getElementById("kissesBtn").addEventListener("click", ()=>{
    const container = document.getElementById("kissesContainer");
    let count = 0;
    const interval = setInterval(()=>{
        for(let i=0;i<5;i++){
            const kiss = document.createElement("div");
            kiss.innerText="💋";
            kiss.style.position="absolute";
            kiss.style.left=Math.random()*90 + "%";
            kiss.style.top="-50px";
            kiss.style.fontSize=(Math.random()*24 +16)+"px";
            kiss.style.opacity = 0.8;
            kiss.style.transition="top 3s linear, opacity 3s linear";
            container.appendChild(kiss);
            setTimeout(()=>{ kiss.style.top = (Math.random()*80 +10)+"%"; kiss.style.opacity=0; },50);
            setTimeout(()=>{ if(kiss.parentNode) container.removeChild(kiss); },3100);
        }
        count++;
        if(count>10){
            clearInterval(interval);
            const text = document.getElementById("bigText");
            text.innerHTML = `Kızım — انتي بنتي وحبيبتي ورفيقتي وكل شي<br>بحبك هلأ وبكرا وبعدين`;
            text.style.opacity = 1;
            document.getElementById("memoriesBtn").style.display = "block"; // ظهور زر الذكريات
        }
    },500);
});

// زر الذكريات
document.getElementById("memoriesBtn").addEventListener("click", ()=>{
    nextPage(4);
});

// الصفحة الرابعة توليب وكلمات
function showTulips(){
    const tulipContainer = document.getElementById("tulipContainer");
    const wordsContainer = document.getElementById("memoryContainer");
    tulipContainer.innerHTML = "";
    wordsContainer.innerHTML = "";

    // توليب كثيف
    for(let i=0;i<40;i++){
        const tulip = document.createElement("div");
        tulip.className = "tulip";
        tulip.innerText = "🌷";
        tulip.style.left = Math.random()*90 + "%";
        tulip.style.fontSize = (Math.random()*30+20)+"px";
        tulip.style.animationDuration = (6+Math.random()*4)+"s";
        tulipContainer.appendChild(tulip);
    }

    const words = ["تبليطات","شعيبيات","ادليب","دادو","تنفسك","بيبي","مية وردة","لما تشوفها","الاخرس","مكالمات","المعهد","بحبك","بطني توجعني","البسه","انفاسك","افلام","اديلا","لبنان","بحلم فيكي","اويلي يابه","الكعكة","DDD","التاتو","تليفونك","جميل"];

    // كلمات تتحرك للأعلى وتكرر
    for(let r=0;r<3;r++){
        words.forEach((word,i)=>{
            const div = document.createElement("div");
            div.className = "memoryWord";
            div.innerText = word;
            div.style.left = Math.random()*80 + 10 + "%";
            div.style.top = (Math.random()*80 + 10) + "%";
            div.style.fontSize = (Math.random()*18+14)+"px";
            wordsContainer.appendChild(div);
            setTimeout(()=>{
                div.style.opacity = 1;
                div.style.top = "-10%"; // يختفي عند الرأس
            }, i*1000 + r*4000);
        });
    }
}
</script>

</body>
</html>
